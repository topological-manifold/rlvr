[project]
name = "rlvr"
version = "0.1.0"
description = "Experiments with Hugging Face models and datasets"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch>=2.10",
    "transformers>=5",
    "accelerate>=1.1",
    "datasets>=4.4",
    "huggingface-hub>=1",
    "sentencepiece>=0.2.1",
    "protobuf>=6",
    "sympy>=1.14.0",
    "latex2sympy2-extended>=1.11.0",
    "math-verify>=0.9.0",
    "pylatexenc>=2.11",
    "antlr4-python3-runtime==4.11.*",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
]
